<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Personal OS — Direction A · Deck</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="deck">
      <!-- ── status strip ─────────────────────────────────────────── -->
      <header class="strip">
        <div class="strip-brand">
          <span class="mark">P</span>
          <span>PERSONAL&nbsp;OS</span>
        </div>
        <span class="strip-sep"></span>
        <span class="stat">
          <b>Studio</b>
        </span>
        <span class="strip-sep"></span>
        <span class="stat">
          running <b class="tnum">1</b>
        </span>
        <span class="stat alert">
          needs you <b class="tnum">2</b>
        </span>
        <span class="stat">
          spend today <b class="tnum">29</b>
        </span>
        <span class="stat">
          seq <b class="tnum">4812</b>
        </span>
        <div class="strip-right">
          <span class="live"><span class="dot"></span>live</span>
          <span class="kbd">⌘K</span>
        </div>
      </header>

      <!-- ── icon rail ─────────────────────────────────────────────── -->
      <nav class="rail">
        <a class="rail-item on" href="index.html" title="Deck" aria-label="Deck">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
            <rect x="1.5" y="1.5" width="5.5" height="5.5" />
            <rect x="9" y="1.5" width="5.5" height="5.5" />
            <rect x="1.5" y="9" width="5.5" height="5.5" />
            <rect x="9" y="9" width="5.5" height="5.5" />
          </svg>
        </a>
        <a class="rail-item" href="conversation.html" title="Conversations" aria-label="Conversations">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
            <path d="M14 9.5A1.5 1.5 0 0 1 12.5 11H6l-3.5 2.5V11H3.5A1.5 1.5 0 0 1 2 9.5v-6A1.5 1.5 0 0 1 3.5 2h9A1.5 1.5 0 0 1 14 3.5z" />
          </svg>
          <span class="pip"></span>
        </a>
        <a class="rail-item" href="#" title="Agents" aria-label="Agents">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
            <rect x="3" y="5.5" width="10" height="8" rx="1.5" />
            <path d="M8 5.5V3M6.5 3h3M5.5 9v1.5M10.5 9v1.5" />
          </svg>
        </a>
        <a class="rail-item" href="#" title="Factory" aria-label="Factory">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
            <path d="M8 1.5 14 5v6l-6 3.5L2 11V5z" />
            <path d="M8 8.5 14 5M8 8.5v6M8 8.5 2 5" />
          </svg>
        </a>
        <a class="rail-item" href="#" title="Resources" aria-label="Resources">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
            <ellipse cx="8" cy="3.5" rx="5.5" ry="2" />
            <path d="M2.5 3.5v9c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2v-9M2.5 8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2" />
          </svg>
        </a>
        <a class="rail-item" href="#" title="Automations" aria-label="Automations">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
            <path d="M9 1.5 3.5 9H8l-1 5.5L12.5 7H8z" />
          </svg>
        </a>
      </nav>

      <!-- ── main pane ─────────────────────────────────────────────── -->
      <main class="main">
        <section class="pane">
          <div class="pane-head">
            <span class="pane-title">Event stream</span>
            <span class="pane-count" id="evCount">12 events</span>
            <div class="filters" id="filters">
              <button class="filter on" data-kind="all">all</button>
              <button class="filter" data-kind="message">messages</button>
              <button class="filter" data-kind="task">tasks</button>
              <button class="filter" data-kind="agent">agents</button>
              <button class="filter" data-kind="automation">automations</button>
              <button class="filter" data-kind="approval">approvals</button>
              <button class="filter" data-kind="resource">resources</button>
            </div>
          </div>
          <div class="stream" id="stream"></div>
        </section>

        <aside class="inspector">
          <div class="insp-head">
            <span class="pane-title" id="inspLabel">Needs you</span>
            <span class="pane-count" id="inspCount"></span>
          </div>
          <div class="insp-body" id="inspector"></div>
        </aside>
      </main>

      <!-- ── command bar ───────────────────────────────────────────── -->
      <footer class="bar">
        <span>deck · studio · last event 09:44:31</span>
        <span class="hint">
          <span class="kbd">↑↓</span> select
          <span class="kbd">↵</span> open
          <span class="kbd">⌘K</span> commands
        </span>
      </footer>
    </div>

    <script src="../shared/data.js"></script>
    <script>
      (function () {
        'use strict';

        /* Which stream bucket an event type belongs to. */
        var KIND = {
          'message.delta': 'message',
          'message.updated': 'message',
          'message.created': 'message',
          'task.updated': 'task',
          'agent.status': 'agent',
          'automation.run': 'automation',
          'approval.requested': 'approval',
          'resource.updated': 'resource',
          'artifact.created': 'resource',
          'execution.status': 'execution',
        };

        var state = { kind: 'all', selected: null };

        var streamEl = document.getElementById('stream');
        var inspectorEl = document.getElementById('inspector');
        var countEl = document.getElementById('evCount');
        var inspLabelEl = document.getElementById('inspLabel');
        var inspCountEl = document.getElementById('inspCount');

        function visible() {
          if (state.kind === 'all') return POS.events;
          return POS.events.filter(function (e) {
            return KIND[e.type] === state.kind;
          });
        }

        function renderStream() {
          var rows = visible();
          countEl.textContent = rows.length + (rows.length === 1 ? ' event' : ' events');

          streamEl.innerHTML = rows
            .map(function (e) {
              var kind = KIND[e.type] || 'execution';
              var on = state.selected === e.seq ? ' on' : '';
              var pending = e.pending ? ' · pending' : '';
              return (
                '<div class="evrow' +
                on +
                '" data-seq="' +
                e.seq +
                '">' +
                '<span class="seq">#' +
                e.seq +
                '</span>' +
                '<span class="at">' +
                e.at +
                '</span>' +
                '<span class="evtype" data-kind="' +
                kind +
                '">' +
                e.type +
                '</span>' +
                '<span class="evactor">' +
                (e.actor || '—') +
                '</span>' +
                '<span class="evsummary">' +
                e.summary +
                pending +
                '</span>' +
                '</div>'
              );
            })
            .join('');

          Array.prototype.forEach.call(streamEl.querySelectorAll('.evrow'), function (row) {
            row.addEventListener('click', function () {
              state.selected = parseInt(row.getAttribute('data-seq'), 10);
              renderStream();
              renderInspector();
            });
          });
        }

        /* ---- inspector: needs-you, or the selected event ------------- */

        function renderNeedsYou() {
          inspLabelEl.textContent = 'Needs you';
          inspCountEl.textContent =
            POS.approvals.length + ' approvals · 1 review';

          var html = '';

          POS.approvals.forEach(function (a) {
            html +=
              '<div class="block"><div class="block-head"><span class="tag err">approval</span>' +
              '<span>' +
              a.id +
              '</span></div><div class="block-body">' +
              '<div class="insp-title">' +
              a.summary +
              '</div>' +
              '<div class="insp-sub">requested by ' +
              a.requestedBy +
              ' · ' +
              a.createdAt +
              '</div>' +
              '<dl class="kv"><dt>target</dt><dd>' +
              (a.details.target || '—') +
              '</dd><dt>why</dt><dd>' +
              a.details.why +
              '</dd></dl>' +
              '<div class="btnrow"><button class="btn primary">Approve</button>' +
              '<button class="btn danger">Decline</button></div>' +
              '</div></div>';
          });

          var review = POS.tasks.filter(function (t) {
            return t.status === 'review';
          })[0];
          if (review) {
            html +=
              '<div class="block"><div class="block-head"><span class="tag violet">review</span><span>' +
              review.id +
              '</span></div><div class="block-body">' +
              '<div class="insp-title">' +
              review.title +
              '</div>' +
              '<div class="insp-sub">assignee ' +
              review.assignee +
              ' · acceptance pending</div>' +
              '<ul style="color:var(--muted);line-height:1.6">' +
              review.acceptanceCriteria
                .map(function (c) {
                  return '<li>· ' + c + '</li>';
                })
                .join('') +
              '</ul>' +
              '<div class="btnrow"><button class="btn primary">Accept</button>' +
              '<button class="btn">Send back</button></div>' +
              '</div></div>';
          }

          html +=
            '<div class="block"><div class="block-head"><span class="tag warn">blocked</span><span>tk_spend</span></div>' +
            '<div class="block-body"><div class="insp-title">Add a spend dashboard</div>' +
            '<div class="insp-sub">blocked on a data-source grant</div></div></div>';

          inspectorEl.innerHTML = html;
        }

        function renderSelected(ev) {
          inspLabelEl.textContent = 'Event #' + ev.seq;
          inspCountEl.textContent = ev.type;

          var html =
            '<div class="block"><div class="block-head"><span class="tag info">' +
            ev.type +
            '</span></div><div class="block-body"><dl class="kv">' +
            '<dt>seq</dt><dd>' +
            ev.seq +
            '</dd><dt>at</dt><dd>' +
            ev.at +
            '</dd><dt>actor</dt><dd>' +
            (ev.actor || '—') +
            '</dd><dt>execution</dt><dd>' +
            ev.executionId +
            '</dd><dt>summary</dt><dd>' +
            ev.summary +
            '</dd>';

          if (ev.toolName) {
            html += '<dt>tool</dt><dd>' + ev.toolName + '</dd>';
          }
          if (ev.status) {
            html += '<dt>status</dt><dd>' + ev.status + '</dd>';
          }
          html += '</dl></div></div>';

          if (ev.type === 'approval.requested') {
            var approval = POS.approvals[0];
            html +=
              '<div class="block"><div class="block-head"><span class="tag err">pending</span></div>' +
              '<div class="block-body"><dl class="kv"><dt>target</dt><dd>' +
              approval.details.target +
              '</dd><dt>why</dt><dd>' +
              approval.details.why +
              '</dd></dl>' +
              '<div class="btnrow"><button class="btn primary">Approve</button>' +
              '<button class="btn danger">Decline</button></div></div></div>';
          }

          if (ev.type === 'artifact.created') {
            var res = POS.resourceById('rs_notes');
            html +=
              '<div class="block"><div class="block-head"><span class="tag">resource</span></div>' +
              '<div class="block-body"><div class="insp-title">' +
              res.title +
              '</div><div class="insp-sub">' +
              res.type +
              ' · rev ' +
              res.revision +
              '</div><div class="insp-sub">' +
              res.summary +
              '</div></div></div>';
          }

          inspectorEl.innerHTML = html;
        }

        function renderInspector() {
          if (state.selected == null) {
            renderNeedsYou();
            return;
          }
          var ev = POS.events.filter(function (e) {
            return e.seq === state.selected;
          })[0];
          if (ev) renderSelected(ev);
          else renderNeedsYou();
        }

        /* ---- filters ------------------------------------------------- */

        Array.prototype.forEach.call(
          document.querySelectorAll('#filters .filter'),
          function (btn) {
            btn.addEventListener('click', function () {
              Array.prototype.forEach.call(
                document.querySelectorAll('#filters .filter'),
                function (b) {
                  b.classList.remove('on');
                }
              );
              btn.classList.add('on');
              state.kind = btn.getAttribute('data-kind');
              state.selected = null;
              renderStream();
              renderInspector();
            });
          }
        );

        renderStream();
        renderInspector();
      })();
    </script>
  </body>
</html>
