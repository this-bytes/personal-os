<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Release notes for v1.0 — Direction D · Forge</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body class="dense">
    <div class="field">
      <div class="blob a"></div>
      <div class="blob b"></div>
      <div class="blob c"></div>
    </div>

    <header class="topbar">
      <span class="mark">P</span>
      <span class="brand">Personal OS<span class="mode">forge</span></span>

      <nav class="rooms">
        <a href="index.html"><span class="dot"></span>Map</a>
        <a class="on" href="conversation.html"><span class="dot"></span>Work</a>
        <a href="dashboard.html"><span class="dot"></span>Dashboards</a>
      </nav>

      <div class="topbar-right">
        <span class="live"><span class="dot"></span>live</span>
        <span class="pill">Studio</span>
        <span class="avatar">A</span>
      </div>
    </header>

    <div class="work">
      <!-- ── thread list ────────────────────────────────────────── -->
      <aside class="threadlist" id="threadList"></aside>

      <!-- ── transcript ─────────────────────────────────────────── -->
      <section class="transcript">
        <div class="thread-head">
          <div class="grow">
            <h1>Release notes for v1.0</h1>
            <div class="sub">
              <span class="pill accent">mentions</span>
              <span>You, Cog, Wren</span>
              <span>·</span>
              <span class="mono">cv_release</span>
              <span>·</span>
              <span class="mono">turns 3/8</span>
              <span>·</span>
              <span class="mono">spend 20</span>
              <span>·</span>
              <span class="mono">not paused</span>
            </div>
          </div>
        </div>

        <div class="messages" id="messages"></div>

        <div class="dock">
          <div class="composer">
            <span class="placeholder">Message the thread — @ to address an agent</span>
            <button class="send" aria-label="Send">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M2 8h11M9 4l4 4-4 4" />
              </svg>
            </button>
          </div>
          <div class="composer-bar">
            <span class="pill accent">mentions</span>
            <span>depth 0</span>
            <span>·</span>
            <span>max 8 turns</span>
            <span>·</span>
            <span>@ to address · ⌘↵ to send</span>
          </div>
        </div>
      </section>

      <!-- ── trace gutter ───────────────────────────────────────── -->
      <aside class="trace">
        <div class="panel-head">
          <h2>Execution trace</h2>
          <span class="n">ex_2</span>
        </div>
        <div class="trace-body" id="trace"></div>

        <div class="presence">
          <h3>Presence</h3>
          <div id="people"></div>
        </div>
      </aside>
    </div>

    <script src="../shared/data.js"></script>
    <script>
      (function () {
        'use strict';

        /* ---- thread list ------------------------------------------------ */

        document.getElementById('threadList').innerHTML = POS.conversations
          .map(function (c, i) {
            var on = i === 0 ? ' on' : '';
            var dots = c.participants
              .filter(function (p) {
                return p.type === 'agent';
              })
              .map(function (p) {
                return (
                  '<span class="dot" style="background:var(--agent-' +
                  POS.accent(p.agentConnectionId) +
                  ')"></span>'
                );
              })
              .join('');
            var paused = c.paused ? ' · paused' : '';
            var unread = c.unread ? ' <span class="pill live">' + c.unread + '</span>' : '';
            return (
              '<button class="threaditem' +
              on +
              '"><div class="t"><span class="truncate">' +
              c.title +
              '</span>' +
              unread +
              '</div><div class="p">' +
              c.preview +
              '</div><div class="m">' +
              dots +
              '<span>' +
              c.routingMode +
              paused +
              ' · ' +
              c.updatedAt.slice(11, 16) +
              '</span></div></button>'
            );
          })
          .join('');

        /* ---- messages ---------------------------------------------------- */

        function mentionMarkup(text) {
          return text.replace(/@([A-Za-z][\w-]*)/g, function (m, name) {
            var agent = POS.agents.filter(function (a) {
              return a.name.toLowerCase() === name.toLowerCase();
            })[0];
            if (!agent) return m;
            return '<span class="mention m-' + agent.accent + '">' + m + '</span>';
          });
        }

        document.getElementById('messages').innerHTML = POS.messages
          .map(function (m) {
            if (m.kind === 'activity') {
              return (
                '<div class="msg system"><div class="orb">◦</div><div class="body">' +
                m.content[0].text +
                '</div></div>'
              );
            }

            var isHuman = m.origin.kind === 'human';
            var agent = isHuman ? null : POS.agentById(m.origin.actorId);
            var colour = isHuman
              ? 'linear-gradient(135deg,#a78bfa,#22d3ee)'
              : 'var(--agent-' + agent.accent + ')';

            var parts = m.content
              .map(function (part) {
                if (part.type === 'text') {
                  return '<div>' + mentionMarkup(part.text) + '</div>';
                }
                if (part.type === 'artifact') {
                  var res = POS.resourceById(part.resourceId);
                  return (
                    '<div class="attach"><span class="ic"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">' +
                    '<path d="M9 1.5H4.5A1.5 1.5 0 0 0 3 3v10a1.5 1.5 0 0 0 1.5 1.5h7A1.5 1.5 0 0 0 13 13V5.5z" />' +
                    '<path d="M9 1.5V5a.5.5 0 0 0 .5.5H13" /></svg></span>' +
                    '<span><span class="nm">' +
                    res.title +
                    '</span><span class="mt" style="display:block">' +
                    res.type +
                    ' · rev ' +
                    res.revision +
                    ' · updated ' +
                    res.updatedAt +
                    '</span></span></div>'
                  );
                }
                return '';
              })
              .join('');

            return (
              '<div class="msg"><div class="orb" style="background:' +
              colour +
              '">' +
              (isHuman ? 'A' : agent.name.charAt(0)) +
              '</div><div><div class="who">' +
              (isHuman ? 'You' : agent.name) +
              (agent ? '<span class="tagx">' + agent.adapterLabel + '</span>' : '') +
              '</div><div class="body">' +
              parts +
              '</div><div class="when">' +
              m.createdAt.slice(11, 16) +
              (agent ? ' · depth ' + m.origin.depth : '') +
              (m.executionId ? ' · ' + m.executionId : '') +
              '</div></div></div>'
            );
          })
          .join('');

        /* ---- execution trace ----------------------------------------------- */

        var TRACE = [
          { cls: 'hot', t: '09:38:20', html: '<b>ex_2</b> queued · Wren (a2a)' },
          { cls: '', t: '09:38:22', html: 'claimed by worker · attempt 1' },
          { cls: 'ok', t: '09:38:24', html: 'session started · <span class="t">a2a</span>' },
          { cls: '', t: '09:38:31', html: 'tool.started <b>read_resource</b>' },
          { cls: 'ok', t: '09:38:34', html: 'tool.completed · rev 2 · 1.4 kB' },
          { cls: '', t: '09:38:40', html: 'tool.started <b>read_resource</b>' },
          { cls: 'ok', t: '09:38:42', html: 'tool.completed · 6 sections' },
          { cls: '', t: '09:38:50', html: 'tool.started <b>update_resource</b>' },
          { cls: 'ok', t: '09:39:12', html: 'tool.completed · rev 2 → 3' },
          { cls: '', t: '09:39:14', html: 'message.delta × <b>34</b>' },
          { cls: 'ok', t: '09:41:02', html: 'message.completed · 412 chars' },
          { cls: 'hot', t: '09:41:03', html: 'artifact.created · rs_notes' },
          { cls: 'ok', t: '09:41:04', html: 'execution.status <b>completed</b>' },
          { cls: 'warn', t: '09:41:04', html: 'spend <b>8 units</b> · duration 164s' },
        ];

        document.getElementById('trace').innerHTML = TRACE.map(function (e) {
          return (
            '<div class="tr ' +
            e.cls +
            '"><div class="node"></div><div class="txt"><span class="t">' +
            e.t +
            '</span><br />' +
            e.html +
            '</div></div>'
          );
        }).join('');

        /* ---- presence ------------------------------------------------------- */

        var conv = POS.conversations[0];

        document.getElementById('people').innerHTML = conv.participants
          .map(function (p) {
            if (p.type === 'human') {
              return (
                '<div class="pnode"><span class="o" style="background:linear-gradient(135deg,#a78bfa,#22d3ee)">A</span>' +
                '<span><span class="nm">You</span><span class="ty">the owner</span></span></div>'
              );
            }
            var a = POS.agentById(p.agentConnectionId);
            var live = a.status === 'connected';
            return (
              '<div class="pnode"><span class="o" style="background:var(--agent-' +
              a.accent +
              ');color:' +
              (live ? 'var(--accent-ink)' : 'rgba(255,255,255,0.45)') +
              '">' +
              a.name.charAt(0) +
              '</span><span><span class="nm">' +
              a.name +
              '</span><span class="ty">' +
              a.adapterType +
              ' · ' +
              a.status +
              '</span></span></div>'
            );
          })
          .join('');
      })();
    </script>
  </body>
</html>
