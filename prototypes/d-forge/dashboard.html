<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spend dashboard — Direction D · Forge</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="field">
      <div class="blob a"></div>
      <div class="blob b"></div>
      <div class="blob c"></div>
    </div>

    <header class="topbar">
      <span class="mark">P</span>
      <span class="brand">Personal OS<span class="mode">forge</span></span>

      <nav class="rooms">
        <a href="index.html"><span class="dot"></span>Map</a>
        <a href="conversation.html"><span class="dot"></span>Work</a>
        <a class="on" href="dashboard.html"><span class="dot"></span>Dashboards</a>
      </nav>

      <div class="topbar-right">
        <span class="live"><span class="dot"></span>live</span>
        <span class="pill">Studio</span>
        <span class="avatar">A</span>
      </div>
    </header>

    <main class="dash">
      <div class="dash-inner">
        <div class="dash-head">
          <div>
            <h1>Spend dashboard</h1>
            <p>Built by Hermes. Spend per adapter per day, rebuilt every 30 minutes.</p>
          </div>
          <div class="dash-meta">
            <span class="pill accent">dashboard</span>
            <span class="pill">rev 4</span>
            <span class="pill cyan">refreshes 30m</span>
            <span class="pill live">updated 09:30</span>
          </div>
        </div>

        <!-- metrics -->
        <div class="metrics" id="metrics"></div>

        <div class="panels">
          <!-- chart -->
          <section class="panel">
            <div class="panel-head">
              <h2>Spend per day</h2>
              <span class="n">last 7 days · units</span>
            </div>
            <div class="chart" id="chart"></div>
          </section>

          <!-- table -->
          <section class="panel">
            <div class="panel-head">
              <h2>By adapter</h2>
              <span class="n">today</span>
            </div>
            <table class="table" id="table"></table>
          </section>
        </div>

        <div class="panels" style="margin-top: 12px; grid-template-columns: 1fr 1fr">
          <section class="panel">
            <div class="panel-head">
              <h2>Bound data source</h2>
              <span class="n">read-only</span>
            </div>
            <table class="table" id="source"></table>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h2>Kept fresh by</h2>
              <span class="n">automation</span>
            </div>
            <table class="table" id="automation"></table>
          </section>
        </div>
      </div>
    </main>

    <script src="../shared/data.js"></script>
    <script>
      (function () {
        'use strict';

        /* The dashboard is bound to a data source, so every figure below is
         * derived from that source's payload — the way the real resource API
         * would serve it, not from numbers typed into the mock. */
        var source = POS.resourceById('rs_billing');
        var rows = source.data.payload;

        var DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

        /* Distinct days, oldest first, then the last seven. */
        var days = [];
        rows.forEach(function (r) {
          var d = days.filter(function (x) {
            return x.day === r.day;
          })[0];
          if (!d) {
            d = { day: r.day, v: 0 };
            days.push(d);
          }
          d.v += r.units;
        });
        days.sort(function (a, b) {
          return a.day < b.day ? -1 : 1;
        });
        days = days.slice(-7);
        days.forEach(function (d) {
          d.label = DAY_NAMES[new Date(d.day + 'T00:00:00').getDay()];
        });

        var today = days[days.length - 1].day;

        /* Per-adapter totals for today. */
        var adapterIds = [];
        rows.forEach(function (r) {
          if (r.day === today && adapterIds.indexOf(r.adapter) === -1) {
            adapterIds.push(r.adapter);
          }
        });
        var byAdapter = adapterIds
          .map(function (id) {
            var total = 0;
            rows.forEach(function (r) {
              if (r.day === today && r.adapter === id) total += r.units;
            });
            return {
              id: id,
              v: total,
              agent: POS.agents.filter(function (a) {
                return a.name.toLowerCase() === id;
              })[0],
            };
          })
          .sort(function (a, b) {
            return b.v - a.v;
          });

        var spend = byAdapter.reduce(function (sum, r) {
          return sum + r.v;
        }, 0);
        var baseline = days.reduce(function (sum, d) {
          return sum + d.v;
        }, 0) / days.length;
        var delta = Math.round(((spend - baseline) / baseline) * 100);
        var cap = POS.workspace.autonomyPolicy.dailySpendUnits;

        var metrics = [
          {
            k: 'Spend today',
            v: spend,
            d: (delta >= 0 ? '+' : '') + delta + '% against the 7-day baseline',
            cls: delta > 0 ? 'up' : 'down',
          },
          {
            k: 'Daily cap',
            v: cap,
            d: 'enforced server-side, never by the client',
          },
          {
            k: 'Remaining',
            v: cap - spend,
            d: 'units left before the policy stops work',
          },
          {
            k: 'Adapters active',
            v: POS.agents.filter(function (a) {
              return a.enabled;
            }).length,
            d: 'of ' + POS.agents.length + ' connections',
          },
        ];

        document.getElementById('metrics').innerHTML = metrics
          .map(function (m) {
            return (
              '<div class="metric"><div class="k">' +
              m.k +
              '</div><div class="v">' +
              m.v +
              '</div><div class="d' +
              (m.cls ? ' ' + m.cls : '') +
              '">' +
              m.d +
              '</div></div>'
            );
          })
          .join('');

        /* ---- chart ------------------------------------------------------- */

        var BASE = 170;
        var MAXH = 130;
        var MAXV = Math.max.apply(
          null,
          days.map(function (d) {
            return d.v;
          }),
        );
        var X0 = 26;
        var BW = 52;
        var PITCH = 80;

        var bars = days
          .map(function (row, i) {
            var h = Math.round((row.v / MAXV) * MAXH);
            var x = X0 + i * PITCH;
            var y = BASE - h;
            var fill = row.day === today ? 'url(#barhot)' : 'url(#barfill)';
            var edge = row.day === today ? ' stroke="rgba(167,139,250,0.75)" stroke-width="1"' : '';
            return (
              '<rect class="bar-rect" x="' +
              x +
              '" y="' +
              y +
              '" width="' +
              BW +
              '" height="' +
              h +
              '" rx="4" fill="' +
              fill +
              '"' +
              edge +
              ' />' +
              '<text class="axis-label" x="' +
              (x + BW / 2) +
              '" y="' +
              (y - 7) +
              '" text-anchor="middle">' +
              row.v +
              '</text>' +
              '<text class="axis-label" x="' +
              (x + BW / 2) +
              '" y="' +
              (BASE + 18) +
              '" text-anchor="middle">' +
              row.label +
              '</text>'
            );
          })
          .join('');

        document.getElementById('chart').innerHTML =
          '<svg viewBox="0 0 620 200" role="img" aria-label="Spend per day for the last seven days">' +
          '<defs>' +
          '<linearGradient id="barfill" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0%" stop-color="#22d3ee" stop-opacity="0.85" />' +
          '<stop offset="100%" stop-color="#22d3ee" stop-opacity="0.18" />' +
          '</linearGradient>' +
          '<linearGradient id="barhot" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0%" stop-color="#c4b5fd" stop-opacity="1" />' +
          '<stop offset="100%" stop-color="#a78bfa" stop-opacity="0.34" />' +
          '</linearGradient>' +
          '</defs>' +
          '<line class="axis" x1="14" y1="' +
          BASE +
          '" x2="606" y2="' +
          BASE +
          '" />' +
          bars +
          '</svg>';

        /* ---- by adapter --------------------------------------------------- */

        document.getElementById('table').innerHTML =
          '<thead><tr><th>Adapter</th><th>Type</th><th>Share</th><th style="text-align:right">Units</th></tr></thead><tbody>' +
          byAdapter
            .map(function (row) {
              var a = row.agent;
              var pct = Math.round((row.v / spend) * 100);
              return (
                '<tr><td><span class="who"><span class="sw" style="background:var(--agent-' +
                a.accent +
                ')"></span>' +
                a.name +
                '</span></td><td class="faint">' +
                a.adapterType +
                '</td><td><span class="share"><i style="width:' +
                pct +
                '%"></i></span></td><td class="num">' +
                row.v +
                '</td></tr>'
              );
            })
            .join('') +
          '</tbody><tfoot><tr><td colspan="3">Total</td><td class="num">' +
          spend +
          '</td></tr></tfoot>';

        /* ---- bound source ------------------------------------------------- */

        document.getElementById('source').innerHTML =
          '<tbody><tr><td class="faint">Name</td><td>' +
          source.title +
          '</td></tr><tr><td class="faint">Kind</td><td>' +
          source.data.kind +
          '</td></tr><tr><td class="faint">Rows</td><td>' +
          source.data.payload.length +
          '</td></tr><tr><td class="faint">Scope</td><td>cost table only</td></tr><tr><td class="faint">Revision</td><td>' +
          source.revision +
          '</td></tr><tr><td class="faint">Added by</td><td>Owner</td></tr></tbody>';

        /* ---- refresh automation ------------------------------------------- */

        var auto = POS.automations.filter(function (a) {
          return a.id === 'au_refresh';
        })[0];

        document.getElementById('automation').innerHTML =
          '<tbody><tr><td class="faint">Title</td><td>' +
          auto.title +
          '</td></tr><tr><td class="faint">Trigger</td><td>every ' +
          auto.trigger.everyMinutes +
          ' minutes</td></tr><tr><td class="faint">Action</td><td>resource.refresh</td></tr><tr><td class="faint">State</td><td><span class="pill ok">enabled</span></td></tr><tr><td class="faint">Next run</td><td>' +
          auto.nextRunAt +
          '</td></tr></tbody>';
      })();
    </script>
  </body>
</html>
