<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Personal OS — Direction D · Forge</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="field">
      <div class="blob a"></div>
      <div class="blob b"></div>
      <div class="blob c"></div>
    </div>

    <header class="topbar">
      <span class="mark">P</span>
      <span class="brand">Personal OS<span class="mode">forge</span></span>

      <nav class="rooms">
        <a class="on" href="index.html"><span class="dot"></span>Map</a>
        <a href="conversation.html"><span class="dot"></span>Work</a>
        <a href="dashboard.html"><span class="dot"></span>Dashboards</a>
      </nav>

      <div class="topbar-right">
        <span class="live"><span class="dot"></span>live</span>
        <span class="pill">Studio</span>
        <span class="avatar">A</span>
      </div>
    </header>

    <div class="shell">
      <!-- ── orientation canvas ─────────────────────────────────── -->
      <section class="canvas">
        <div class="canvas-head">
          <h1>Your orbit</h1>
          <p>
            Five agents, four live threads, one you. This is the orientation room — where
            everything is. When you want to watch the machinery, switch to
            <b>Work</b>.
          </p>
        </div>

        <div class="counters" id="counters"></div>

        <div class="stage">
          <svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" id="constellation"></svg>
        </div>

        <div class="legend">
          <span class="k"><span class="swatch" style="background: var(--accent-2)"></span>thread in progress</span>
          <span class="k"><span class="swatch" style="background: rgba(255, 255, 255, 0.28)"></span>thread</span>
          <span class="k"><span class="swatch" style="background: var(--accent)"></span>you</span>
          <span class="k"><span class="swatch" style="background: var(--live)"></span>agent working now</span>
        </div>

        <div class="tiles" id="tiles"></div>
      </section>

      <!-- ── instrument rail ────────────────────────────────────── -->
      <aside class="rail">
        <div class="panel-head">
          <h2>Needs you</h2>
          <span class="n" id="needsCount"></span>
        </div>
        <div class="needs" id="needs"></div>

        <div class="panel-head">
          <h2>Live pulse</h2>
          <span class="n">seq 4812</span>
        </div>
        <div class="pulse" id="pulse"></div>
      </aside>
    </div>

    <script src="../shared/data.js"></script>
    <script>
      (function () {
        'use strict';

        var CX = 400;
        var CY = 250;

        var AGENT_POS = [
          { x: 400, y: 100 },
          { x: 633, y: 204 },
          { x: 544, y: 371 },
          { x: 256, y: 371 },
          { x: 167, y: 204 },
        ];

        var CONV_POS = [
          { x: 149, y: 84 },
          { x: 651, y: 84 },
          { x: 651, y: 416 },
          { x: 149, y: 416 },
        ];

        var LIVE = {
          cv_release: { pos: 1, agents: ['ag_cog', 'ag_wren'], hot: true },
          cv_cost: { pos: 2, agents: ['ag_probe', 'ag_hermes'], hot: false },
          cv_network: { pos: 3, agents: ['ag_hermes'], hot: false },
          cv_review: { pos: 0, agents: ['ag_cog'], hot: false },
        };

        /* Agents with work in flight get the live amber spoke. */
        var BUSY = { ag_cog: true, ag_hermes: true };

        var agentIndex = {};
        POS.agents.forEach(function (a, i) {
          agentIndex[a.id] = i;
        });

        /* ---- constellation ------------------------------------------- */

        var svg = document.getElementById('constellation');
        var parts = [];

        parts.push('<ellipse class="ring" cx="400" cy="250" rx="245" ry="150" />');
        parts.push('<ellipse class="ring" cx="400" cy="250" rx="355" ry="235" />');

        parts.push(
          '<circle cx="400" cy="250" r="42" fill="rgba(167,139,250,0.12)" stroke="rgba(167,139,250,0.5)" />'
        );
        parts.push('<circle cx="400" cy="250" r="26" fill="url(#core)" />');
        parts.push(
          '<defs><linearGradient id="core" x1="0" y1="0" x2="1" y2="1">' +
            '<stop offset="0%" stop-color="#a78bfa" /><stop offset="100%" stop-color="#22d3ee" />' +
            '</linearGradient></defs>'
        );
        parts.push('<text class="core-label" x="400" y="255">You</text>');

        POS.agents.forEach(function (a, i) {
          var p = AGENT_POS[i];
          parts.push(
            '<line class="spoke' +
              (BUSY[a.id] ? ' hot' : '') +
              '" x1="400" y1="250" x2="' +
              p.x +
              '" y2="' +
              p.y +
              '" />'
          );
        });

        Object.keys(LIVE).forEach(function (cid) {
          var conf = LIVE[cid];
          var cp = CONV_POS[conf.pos];
          conf.agents.forEach(function (aid) {
            var p = AGENT_POS[agentIndex[aid]];
            parts.push(
              '<line class="spoke" x1="' +
                p.x +
                '" y1="' +
                p.y +
                '" x2="' +
                cp.x +
                '" y2="' +
                cp.y +
                '" opacity="0.55" />'
            );
          });
        });

        POS.agents.forEach(function (a, i) {
          var p = AGENT_POS[i];
          var off = a.enabled ? '' : ' opacity="0.35"';
          var colour = 'var(--agent-' + a.accent + ')';
          var glow =
            BUSY[a.id] && a.enabled
              ? '<circle cx="' +
                p.x +
                '" cy="' +
                p.y +
                '" r="26" fill="' +
                colour +
                '" opacity="0.16" />'
              : '';
          var ring = a.status === 'degraded' ? ' stroke-dasharray="3 3"' : '';

          parts.push(
            '<g' +
              off +
              '>' +
              glow +
              '<circle cx="' +
              p.x +
              '" cy="' +
              p.y +
              '" r="18" fill="' +
              colour +
              '" opacity="0.92"' +
              ring +
              ' />' +
              '<text class="node-label" x="' +
              p.x +
              '" y="' +
              (p.y + 34) +
              '">' +
              a.name +
              '</text>' +
              '<text class="node-sub" x="' +
              p.x +
              '" y="' +
              (p.y + 47) +
              '">' +
              (a.enabled ? a.status.toUpperCase() : 'DISABLED') +
              '</text>' +
              '</g>'
          );
        });

        Object.keys(LIVE).forEach(function (cid) {
          var conf = LIVE[cid];
          var cp = CONV_POS[conf.pos];
          var conv = POS.conversationById(cid);
          var size = conf.hot ? 8 : 6;
          var label = conv.title.length > 22 ? conv.title.slice(0, 21) + '…' : conv.title;
          parts.push(
            '<g><rect x="' +
              (cp.x - size) +
              '" y="' +
              (cp.y - size) +
              '" width="' +
              size * 2 +
              '" height="' +
              size * 2 +
              '" rx="2.5" transform="rotate(45 ' +
              cp.x +
              ' ' +
              cp.y +
              ')" fill="' +
              (conf.hot ? 'var(--accent-2)' : 'rgba(255,255,255,0.28)') +
              '"' +
              (conf.hot ? ' opacity="0.9"' : '') +
              ' />' +
              '<text class="node-sub" x="' +
              cp.x +
              '" y="' +
              (cp.y + 22) +
              '">' +
              label +
              '</text></g>'
          );
        });

        svg.innerHTML = parts.join('');

        /* ---- counters (Deck's instrument strip, folded in) ------------ */

        var running = POS.executions.filter(function (e) {
          return e.status === 'running';
        }).length;
        var spend = POS.executions.reduce(function (sum, e) {
          return sum + (e.spendUnits || 0);
        }, 0);

        document.getElementById('counters').innerHTML = [
          { k: 'running', v: running, cls: 'live' },
          { k: 'needs you', v: POS.approvals.length + 2, cls: 'live' },
          { k: 'spend today', v: spend, cls: 'data' },
          { k: 'agents', v: POS.agents.filter(function (a) { return a.enabled; }).length },
          { k: 'threads', v: POS.conversations.length },
        ]
          .map(function (c) {
            return (
              '<div class="counter ' +
              (c.cls || '') +
              '"><div class="k">' +
              c.k +
              '</div><div class="v">' +
              c.v +
              '</div></div>'
            );
          })
          .join('');

        /* ---- needs you -------------------------------------------------- */

        var needs = [];

        POS.approvals.forEach(function (a) {
          needs.push({
            hot: true,
            k: 'Approval · ' + a.requestedBy,
            t: a.summary,
            s: a.details.why,
            actions: [
              { label: 'Approve', cls: 'primary' },
              { label: 'Decline', cls: 'quiet' },
            ],
          });
        });

        POS.tasks.forEach(function (t) {
          if (t.status === 'review') {
            needs.push({
              hot: false,
              k: 'Ready for acceptance · ' + t.assignee,
              t: t.title,
              s: 'The agent reported this done. You decide whether it counts.',
              actions: [
                { label: 'Accept', cls: 'primary' },
                { label: 'Send back', cls: 'quiet' },
              ],
            });
          }
          if (t.status === 'blocked') {
            needs.push({
              hot: false,
              k: 'Blocked · ' + t.assignee,
              t: t.title,
              s: 'Waiting on a data-source grant.',
              actions: [{ label: 'Grant access', cls: '' }],
            });
          }
        });

        document.getElementById('needsCount').textContent = needs.length;
        document.getElementById('needs').innerHTML = needs
          .map(function (n) {
            return (
              '<div class="need' +
              (n.hot ? ' hot' : '') +
              '"><div class="k">' +
              n.k +
              '</div><div class="t">' +
              n.t +
              '</div><div class="s">' +
              n.s +
              '</div><div class="btnrow">' +
              n.actions
                .map(function (a) {
                  return '<button class="btn ' + a.cls + '">' + a.label + '</button>';
                })
                .join('') +
              '</div></div>'
            );
          })
          .join('');

        /* ---- live pulse (Deck's event density, Orbit's styling) -------- */

        document.getElementById('pulse').innerHTML = POS.events
          .slice(0, 10)
          .map(function (e, i) {
            return (
              '<div class="pulse-row' +
              (i === 0 ? ' on' : '') +
              '"><span class="seq">#' +
              e.seq +
              '</span><span class="txt"><b>' +
              (e.actor || 'system') +
              '</b> · ' +
              e.summary +
              '</span><span class="at">' +
              e.at +
              '</span></div>'
            );
          })
          .join('');

        /* ---- dashboard tiles ---------------------------------------------- */

        var TYPE_LABEL = {
          dashboard: 'Dashboard',
          document: 'Document',
          'data-source': 'Data source',
          memory: 'Memory',
          task: 'Task',
          automation: 'Automation',
        };

        document.getElementById('tiles').innerHTML = POS.resources
          .slice(0, 4)
          .map(function (r) {
            return (
              '<a class="tile" href="' +
              (r.type === 'dashboard' && r.id === 'rs_spend' ? 'dashboard.html' : '#') +
              '"><div class="t">' +
              r.title +
              '</div><div class="s">' +
              r.summary +
              '</div><div class="k"><span>' +
              TYPE_LABEL[r.type] +
              '</span><span>·</span><span>rev ' +
              r.revision +
              '</span><span>·</span><span>' +
              r.updatedAt +
              '</span></div></a>'
            );
          })
          .join('');
      })();
    </script>
  </body>
</html>
