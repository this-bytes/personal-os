<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Personal OS — Direction B · Desk</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="wordmark">
        Personal OS <span class="sub">desk</span>
      </div>
      <nav class="topnav">
        <a class="on" href="index.html">Today</a>
        <a href="conversation.html">Conversations</a>
        <a href="#">Factory</a>
        <a href="#">Resources</a>
        <a href="#">Automations</a>
      </nav>
      <div class="topbar-right">
        <span class="mode"><span class="dot"></span>Assisted</span>
        <span class="wspick">Studio <span class="faint">▾</span></span>
        <span class="avatar">A</span>
      </div>
    </header>

    <main class="page">
      <!-- ── masthead ─────────────────────────────────────────────── -->
      <div class="masthead">
        <h1>Tuesday, 20 October</h1>
        <p id="lede">Two things need you. One execution is running.</p>
      </div>

      <!-- ── needs you ────────────────────────────────────────────── -->
      <section class="section" id="needsYou">
        <div class="section-head">
          <h2>Needs you</h2>
          <span class="n" id="needsCount"></span>
        </div>
        <div id="needsList"></div>
      </section>

      <!-- ── in flight ────────────────────────────────────────────── -->
      <section class="section">
        <div class="section-head">
          <h2>In flight</h2>
          <span class="n">goals and running work</span>
          <a class="action" href="#">Open the factory →</a>
        </div>
        <div id="goals"></div>
      </section>

      <!-- ── agents ───────────────────────────────────────────────── -->
      <section class="section">
        <div class="section-head">
          <h2>Your agents</h2>
          <span class="n" id="agentsCount"></span>
          <a class="action" href="#">Manage connections →</a>
        </div>
        <div class="agents" id="agents"></div>
      </section>

      <!-- ── automations ──────────────────────────────────────────── -->
      <section class="section">
        <div class="section-head">
          <h2>Automations</h2>
          <span class="n" id="autoCount"></span>
        </div>
        <div class="rows" id="automations"></div>
      </section>

      <!-- ── resources ────────────────────────────────────────────── -->
      <section class="section">
        <div class="section-head">
          <h2>Recently created</h2>
          <span class="n" id="resCount"></span>
        </div>
        <div class="rows" id="resources"></div>
      </section>
    </main>

    <script src="../shared/data.js"></script>
    <script>
      (function () {
        'use strict';

        var STATUS_LABEL = {
          connected: 'Connected',
          degraded: 'Degraded',
          disconnected: 'Disconnected',
          error: 'Error',
          unknown: 'Not connected yet',
        };

        var STATUS_TONE = {
          connected: 'ok',
          degraded: 'warn',
          disconnected: 'err',
          error: 'err',
          unknown: '',
        };

        var TYPE_LABEL = {
          dashboard: 'Dashboard',
          document: 'Document',
          'data-source': 'Data source',
          memory: 'Memory',
          task: 'Task',
          automation: 'Automation',
        };

        /* ---- needs you ------------------------------------------------ */

        var needs = [];

        POS.approvals.forEach(function (a) {
          needs.push({
            accent: true,
            pill: 'Approval',
            tone: 'accent',
            title: a.summary,
            sub: a.details.why,
            meta:
              'Requested by ' +
              a.requestedBy +
              ' · ' +
              a.createdAt +
              ' · target ' +
              a.details.target,
            actions: [
              { label: 'Approve', cls: 'primary' },
              { label: 'Decline', cls: 'quiet danger' },
            ],
          });
        });

        POS.tasks.forEach(function (t) {
          if (t.status === 'review') {
            needs.push({
              accent: true,
              pill: 'Ready for acceptance',
              tone: 'violet',
              title: t.title,
              sub: 'Assigned to ' + t.assignee + '. The agent reported it as done; you decide.',
              meta: '3 acceptance criteria · last updated ' + t.updatedAt,
              actions: [
                { label: 'Accept', cls: 'primary' },
                { label: 'Send back', cls: 'quiet' },
              ],
            });
          }
          if (t.status === 'blocked') {
            needs.push({
              accent: false,
              pill: 'Blocked',
              tone: 'warn',
              title: t.title,
              sub: 'Waiting on a data-source grant for ' + t.assignee + '.',
              meta: 'Goal · Cut inference spend 40% · updated ' + t.updatedAt,
              actions: [{ label: 'Grant access', cls: '' }],
            });
          }
        });

        document.getElementById('needsCount').textContent =
          needs.length + ' waiting';
        document.getElementById('needsList').innerHTML = needs
          .map(function (n) {
            return (
              '<article class="card' +
              (n.accent ? ' attention' : '') +
              '"><div class="row gap-2 between"><span class="pill ' +
              n.tone +
              '">' +
              n.pill +
              '</span></div><div class="card-title mt-2">' +
              n.title +
              '</div><div class="card-sub">' +
              n.sub +
              '</div><div class="card-meta">' +
              n.meta +
              '</div><div class="btnrow">' +
              n.actions
                .map(function (a) {
                  return '<button class="btn ' + a.cls + '">' + a.label + '</button>';
                })
                .join('') +
              '</div></article>'
            );
          })
          .join('');

        document.getElementById('lede').textContent =
          needs.length + ' things need you. One execution is running.';

        /* ---- goals ------------------------------------------------------ */

        document.getElementById('goals').innerHTML = POS.goals
          .map(function (g) {
            var pct = Math.round((g.doneCount / g.taskCount) * 100);
            var paused = g.status === 'paused';
            return (
              '<article class="card"><div class="goal"><div><div class="goal-name">' +
              g.title +
              '</div><div class="goal-sub">' +
              g.description +
              '</div></div><div class="row gap-2">' +
              (paused
                ? '<span class="pill">Paused</span>'
                : '<span class="pill ' +
                  (g.autonomyMode === 'assisted' ? 'accent' : '') +
                  '">' +
                  g.autonomyMode +
                  '</span>') +
              '<span class="pill">' +
              g.doneCount +
              '/' +
              g.taskCount +
              '</span></div><div class="bar-track"><div class="bar-fill' +
              (paused ? ' soft' : '') +
              '" style="width:' +
              pct +
              '%"></div></div></div></article>'
            );
          })
          .join('');

        /* ---- agents ----------------------------------------------------- */

        document.getElementById('agentsCount').textContent =
          POS.agents.length + ' connections';

        document.getElementById('agents').innerHTML = POS.agents
          .map(function (a) {
            return (
              '<article class="agent-card"><div class="top"><span class="agent-orb" style="background:var(--agent-' +
              a.accent +
              ')">' +
              a.name.charAt(0) +
              '</span><div><div class="nm">' +
              a.name +
              '</div><div class="ty">' +
              a.adapterLabel +
              '</div></div></div><div class="st"><span class="dot" style="background:var(--' +
              (STATUS_TONE[a.status] === 'ok'
                ? 'ok'
                : STATUS_TONE[a.status] === 'warn'
                  ? 'warn'
                  : STATUS_TONE[a.status] === 'err'
                    ? 'err'
                    : 'faint') +
              ')"></span>' +
              STATUS_LABEL[a.status] +
              (a.enabled ? '' : ' · disabled') +
              '</div></article>'
            );
          })
          .join('');

        /* ---- automations -------------------------------------------------- */

        document.getElementById('autoCount').textContent =
          POS.automations.filter(function (a) {
            return a.enabled;
          }).length +
          ' of ' +
          POS.automations.length +
          ' running';

        function triggerText(a) {
          if (a.trigger.type === 'schedule') {
            return a.trigger.cron ? 'Every day at ' + a.trigger.cron : 'Every ' + a.trigger.everyMinutes + ' min';
          }
          if (a.trigger.type === 'event') return 'When ' + a.trigger.event;
          return 'On demand';
        }

        document.getElementById('automations').innerHTML = POS.automations
          .map(function (a) {
            var target =
              a.action.type === 'agent.prompt'
                ? (POS.agentById(a.action.agentConnectionId) || {}).name
                : a.action.type === 'resource.refresh'
                  ? (POS.resourceById(a.action.resourceId) || {}).title
                  : a.action.url;
            return (
              '<div class="rowitem"><div><div class="t">' +
              a.title +
              '</div><div class="s">' +
              triggerText(a) +
              ' → ' +
              target +
              '</div></div><div class="right"><span class="pill' +
              (a.enabled ? ' ok' : '') +
              '">' +
              (a.enabled ? 'On' : 'Off') +
              '</span><span>' +
              (a.lastRunAt ? 'last ' + a.lastRunAt : 'never run') +
              '</span></div></div>'
            );
          })
          .join('');

        /* ---- resources ----------------------------------------------------- */

        document.getElementById('resCount').textContent =
          POS.resources.length + ' items';

        document.getElementById('resources').innerHTML = POS.resources
          .map(function (r) {
            return (
              '<div class="rowitem"><div><div class="t">' +
              r.title +
              '</div><div class="s">' +
              r.summary +
              '</div></div><div class="right"><span class="pill">' +
              TYPE_LABEL[r.type] +
              '</span><span>rev ' +
              r.revision +
              ' · ' +
              r.updatedAt +
              '</span></div></div>'
            );
          })
          .join('');
      })();
    </script>
  </body>
</html>
