# Personal OS — one self-hosted instance.
#
# The API server and the execution worker are separate processes that share
# one SQLite database on a shared volume. The volume is a local filesystem on
# the host, which is what SQLite locking requires — do not move it to a
# network share.
#
#   docker compose -f deploy/compose.yaml up --build

name: personal-os

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: server
    image: personal-os:latest
    restart: unless-stopped
    ports:
      - "${PERSONAL_OS_PORT:-4317}:4317"
    environment:
      NODE_ENV: production
      PERSONAL_OS_HOST: 0.0.0.0
      PERSONAL_OS_PORT: 4317
      PERSONAL_OS_DATA_DIR: /data
      # Both processes need the same key to read encrypted agent
      # configuration. Generate one with:
      #   openssl rand -base64 32
      PERSONAL_OS_SECRET_KEY: "${PERSONAL_OS_SECRET_KEY:?set PERSONAL_OS_SECRET_KEY in .env}"
      # Optional static token for headless access (MCP, scripts).
      PERSONAL_OS_OWNER_TOKEN: "${PERSONAL_OS_OWNER_TOKEN:-}"
      PERSONAL_OS_COOKIE_SECURE: "${PERSONAL_OS_COOKIE_SECURE:-false}"
    volumes:
      - personal-os-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4317/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: worker
    # A distinct tag: both services are built from the same context but run
    # different entry points.
    image: personal-os-worker:latest
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PERSONAL_OS_DATA_DIR: /data
      PERSONAL_OS_SECRET_KEY: "${PERSONAL_OS_SECRET_KEY:?set PERSONAL_OS_SECRET_KEY in .env}"
      PERSONAL_OS_OWNER_TOKEN: "${PERSONAL_OS_OWNER_TOKEN:-}"
    volumes:
      - personal-os-data:/data
    # The worker executes agent code. Give it no more access than it needs.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # An agent turn can take minutes. Docker's default stop timeout is ten
    # seconds, and a worker killed mid-turn leaves a job whose lease expires
    # — and the queue runs that turn a second time. The worker is asked to
    # stop, finishes the turn it is running and exits; this is how long it
    # is given to do that.
    stop_grace_period: 15m

volumes:
  personal-os-data:
