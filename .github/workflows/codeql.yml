name: CodeQL

on:
  push:
    # Every branch, not just main.
    #
    # CI runs on every branch push, so a pushed branch is a gated branch — but
    # that claim was false of this workflow: a branch was checked by half the
    # pipeline, and the half that was missing is the security scan. The scan
    # is the leg that catches a bad pattern in a change nobody read carefully,
    # which is exactly the change a branch carries on its way to main.
    branches: ['**']
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published advisory is caught even without a push.
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # `actions: read` is what codeql-action needs to find the workflow run
      # it belongs to, before it uploads its results. A job-level
      # `permissions:` block replaces the workflow-level one wholesale, so
      # without this line the token is granted exactly the other three and
      # cannot read the run — and the step fails with "Resource not accessible
      # by integration" before it analyses anything.
      #
      # That is what happened on every push to this repository: the scan was
      # red because it could not run, not because it found something.
      actions: read
      security-events: write
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      # No build step: CodeQL analyses JavaScript and TypeScript from the
      # source itself, so there is nothing to compile.

      - name: Perform CodeQL analysis
        id: analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
          # The results are published with the run rather than uploaded to
          # GitHub's code scanning.
          #
          # Code scanning is available on a private repository only when the
          # account has GitHub Advanced Security, and this repository is
          # private on a personal account. The scan itself works; the upload
          # is what the licence covers, and with it missing the job failed
          # with "Code scanning is not enabled for this repository" before it
          # had analysed anything.
          #
          # When the repository is public — which is where the owner said it
          # is going — code scanning is free, and this becomes `always` and
          # the results go where a reader can see them.
          upload: 'never'

      - name: Publish the results with the run
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results-${{ matrix.language }}
          path: ${{ steps.analyze.outputs.sarif-output }}
          # If the scan produced nothing, the run fails rather than passing
          # with an empty artifact. A check that cannot fail is worse than no
          # check.
          if-no-files-found: error
