name: CI

on:
  push:
    # Every branch, not just main.
    #
    # Several agents work in this repository at once, and each of them works
    # on a branch. CI that only ran on main would gate nothing an agent does:
    # the branch is where the work is, so the branch is where the gate has to
    # run. A branch that is green is a branch that can be merged without a
    # second round of waiting.
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch makes the older run irrelevant.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # The contract's claims name the commit that carries them, and the
          # gate reads the code at that commit to check the claim. A shallow
          # checkout holds one commit, so the gate could not read those
          # commits and would skip the check. The history is small, so the
          # whole of it is fetched.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate workspace dependencies
        run: npm run verify:dependencies

      # The typecheck and the tests come before the build, deliberately.
      #
      # Both build the packages they need first, so they work on a checkout
      # where nothing has been built. That is the state a contributor is in
      # when they clone the repository and run the documented command, and it
      # is the state the gates broke in once already: the packages resolved
      # through their own dist/, and a fresh clone could not typecheck at all.
      #
      # With the build first, CI would never notice that breaking again — the
      # dist/ directories would already be there and the gates would pass
      # without the thing that makes them pass ever being tested.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Formatting
        run: npm run format:check

      - name: End-to-end smoke test
        run: npx tsx scripts/smoke.ts

      - name: The compiled server boots
        run: npx tsx scripts/verify-build.ts

      # Vite only warns when a chunk is too large, and it still exits zero, so
      # the bundle rules are enforced by a script that fails the build.
      - name: The client bundle stays within its budget
        run: npx tsx scripts/verify-bundle-size.ts

      # The browser download is the slowest step in this job and the one that
      # has cost a run the most. A download that stalled once held the job
      # until its thirty-minute timeout and took the whole run with it: the
      # run was cancelled rather than failed, so the branch was blocked until
      # somebody re-ran it by hand.
      #
      # The browser is a fixed artifact of the Playwright version, so it is
      # cached rather than fetched on every run. The key carries the manifest
      # that pins that version, so a Playwright that moves gets a new cache and
      # a browser that does not move is downloaded once. The step keeps its
      # own short budget, so a download that stalls cannot spend the whole
      # job's thirty minutes: it fails the step instead of the run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/web/package.json') }}

      - name: Install the browser for the end-to-end tests
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: End-to-end browser tests
        run: npm run test:e2e

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The install must not audit. `npm ci` audits by default, so without this
      # flag the job pays for the registry round-trip twice: once inside the
      # install, at npm's own default level, and once in the step below, at the
      # level this job names. The step below is the audit this job is named for.
      #
      # The three jobs that do the same install inside the same budget all carry
      # these two flags. This job was the only one that did not, and it is the
      # one whose job GitHub reported as `cancelled` when it ran out of its ten
      # minutes — which is how a timeout is reported.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # A release that introduces a known vulnerability should not be able to
      # reach main quietly.
      - name: Audit
        run: npm audit --audit-level=high

  contracts:
    name: The published contract matches the tree
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # The gate reads the code at the commit a claim names, so it needs
          # the history. A shallow checkout holds one commit, and the gate
          # would skip the commits it could not see.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The gate is a TypeScript script, so it needs a runner. The one in the
      # lockfile is the one it should get: an unpinned `npx` download would make
      # a gate depend on the registry at the moment it runs, and fail for the
      # wrong reason.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # A published contract that says the code does not implement something
      # the code has implemented is an invitation to build it a second time.
      # The gate reads the contract's implementation-status notes and checks
      # each one it has a claim for against the tree.
      - name: The published claims match the tree
        run: npm run verify:contracts

  contract-pointers:
    name: "The contract's pointers point at code"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The gate is a TypeScript script, so it needs a runner. The one in the
      # lockfile is the one it should get: an unpinned `npx` download would make
      # a gate depend on the registry at the moment it runs, and fail for the
      # wrong reason.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The contract cites the code by line number, and a citation goes stale
      # every time a nearby line changes. Three items have been spent
      # correcting those citations by hand, which makes it a class of defect
      # rather than three coincidences. The gate reads the contract and checks
      # every citation against the tree: the file is there, the line is in
      # range, and the line holds code.
      - name: "The contract's pointers point at code"
        run: npx tsx scripts/verify-contract-pointers.ts

  mcp-parity:
    name: The agent surface matches the owner's
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The gate is a TypeScript script, so it needs a runner. The one in the
      # lockfile is the one it should get: an unpinned `npx` download would make
      # a gate depend on the registry at the moment it runs, and fail for the
      # wrong reason.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Every owner-facing route the published contract names is either matched
      # by a registered MCP tool or named on the list with a written reason. A
      # new human-only route that nobody paired fails the gate, so the gap
      # between what the owner can do and what an agent can do cannot grow
      # quietly.
      #
      # **The gate runs in this pipeline on purpose.** A gate that only runs on
      # the machine that wrote it is not a gate, it is a habit — and this one
      # was written into the registry without the workflow that would have run
      # it, so it would have passed on nobody's machine.
      - name: The agent surface matches the owner's
        run: npm run verify:mcp-parity

  session-references:
    name: The session references resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The gate is a TypeScript script, so it needs a runner. The one in the
      # lockfile is the one it should get: an unpinned `npx` download would make
      # a gate depend on the registry at the moment it runs, and fail for the
      # wrong reason.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The gate drives the product's own code through a real chat turn, so the
      # packages it calls have to be built first. The worker is the one that
      # runs the turn.
      - name: Build the packages the gate drives
        run: npm run build:deps && npm run build -w @personal-os/worker

      # The gate checks that every published session reference resolves, that
      # every committed revision is one the product wrote, and that a turn ends
      # once. A reference that points at a session the product cannot name, or
      # a revision nobody wrote, fails it.
      #
      # **The gate runs in this pipeline on purpose.** A gate that only runs on
      # the machine that wrote it is not a gate, it is a habit.
      - name: The session references resolve
        run: npx tsx scripts/verify-session-references.ts

  source-stack:
    name: Source hosting and restart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # The verifier installs its own disposable source checkout.
      - run: npm run verify:source

  workflow-lint:
    name: Lint the workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # A workflow that does not parse, or that hands an action an input it
      # does not accept, fails only once somebody pushes — and the CodeQL
      # workflow failed exactly that way until this check existed.
      #
      # The version is pinned rather than tracking `latest`, so the lint
      # cannot change under you and the image can be trusted by digest.
      - name: Check the workflow definitions
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
