name: CI

on:
  push:
    # Every branch, not just main.
    #
    # Several agents work in this repository at once, and each of them works
    # on a branch. CI that only ran on main would gate nothing an agent does:
    # the branch is where the work is, so the branch is where the gate has to
    # run. A branch that is green is a branch that can be merged without a
    # second round of waiting.
    branches: ['**']
  pull_request:
  # The heavy lane is one button away.
  #
  # This workflow runs in two lanes. The **fast lane** runs on every push and
  # on every pull request, and it is the lane a branch has to be green in to
  # be merged. The **heavy lane** runs the whole proof — the test suite, the
  # compiled build, the browser tests and the gates that drive the built
  # product — and it runs when somebody asks for it, by hand.
  #
  # The reason for the split is that the heavy lane was costing more time
  # than the work it was judging. A full suite, a web build, a Playwright
  # download and two gates that each rebuild four packages take longer than
  # the slice that changed, so every change waited for a proof that was much
  # bigger than the change. The fast lane keeps the cheap checks — the
  # typecheck, the formatting, the published contract, the pointers and the
  # agent surface — running on every branch, and the heavy lane is there for
  # the work that needs it and for the release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch makes the older run irrelevant.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # The contract's claims name the commit that carries them, and the
          # gate reads the code at that commit to check the claim. A shallow
          # checkout holds one commit, so the gate could not read those
          # commits and would skip the check. The history is small, so the
          # whole of it is fetched.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The install must not audit. `npm ci` audits by default, so without the
      # flag the job pays for the registry round-trip twice: once inside the
      # install, at npm's own default level, and once in the audit job
      # below, at the level that job names.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The manifests and the lockfile have to agree, and the installed tree
      # has to be the one the lockfile describes. It costs a second and it
      # catches a class of defect that is invisible until an install fails.
      - name: Validate workspace dependencies
        run: npm run verify:dependencies

      # The typecheck is the check that earns its place here. It builds the
      # packages it reads the types of, so it works on a checkout where
      # nothing has been built, and it is the check that catches a change
      # that does not compile — which is the mistake that is cheap to make
      # and expensive to find later.
      #
      # The typecheck comes before the build, deliberately: with the build
      # first, CI would never notice that the packages resolved through their
      # own dist/ and a fresh clone could not typecheck at all.
      - name: Typecheck
        run: npm run typecheck

      - name: Formatting
        run: npm run format:check

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The install must not audit. `npm ci` audits by default, so without this
      # flag the job pays for the registry round-trip twice: once inside the
      # install, at npm's own default level, and once in the step below, at
      # the level this job names. The step below is the audit this job is
      # named for.
      #
      # The install skips the scripts, because the audit reads the tree and
      # the registry, and neither needs a native module.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # A release that introduces a known vulnerability should not be able to
      # reach main quietly.
      - name: Audit
        run: npm audit --audit-level=high

  contracts:
    name: The published contract matches the tree
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # The gate reads the code at the commit a claim names, so it needs
          # the history. A shallow checkout holds one commit, and the gate
          # would skip the commits it could not see.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The gate is a TypeScript script, so it needs a runner. The one in the
      # lockfile is the one it should get: an unpinned `npx` download would
      # make a gate depend on the registry at the moment it runs, and fail for
      # the wrong reason.
      #
      # The install skips the scripts, because the gate does not load a native
      # module: it reads the tree and the contract, and it does not drive the
      # product.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # A published contract that says the code does not implement something
      # the code has implemented is an invitation to build it a second time.
      # The gate reads the contract's implementation-status notes and checks
      # each one it has a claim for against the tree.
      - name: The published claims match the tree
        run: npm run verify:contracts

  contract-pointers:
    name: "The contract's pointers point at code"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The contract cites the code by line number, and a citation goes stale
      # every time a nearby line changes. Three items have been spent
      # correcting those citations by hand, which makes it a class of defect
      # rather than three coincidences. The gate reads the contract and checks
      # every citation against the tree: the file is there, the line is in
      # range, and the line holds code.
      - name: "The contract's pointers point at code"
        run: npx tsx scripts/verify-contract-pointers.ts

  mcp-parity:
    name: The agent surface matches the owner's
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Every owner-facing route the published contract names is either
      # matched by a registered MCP tool or named on the list with a written
      # reason. A new human-only route that nobody paired fails the gate, so
      # the gap between what the owner can do and what an agent can do cannot
      # grow quietly.
      #
      # **The gate runs in this pipeline on purpose.** A gate that only runs on
      # the machine that wrote it is not a gate, it is a habit — and this one
      # was written into the registry without the workflow that would have run
      # it, so it would have passed on nobody's machine.
      - name: The agent surface matches the owner's
        run: npm run verify:mcp-parity

  acp-permissions:
    name: A runtime's permission request reaches the owner
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The gate drives the built adapter, so the packages it calls have to be
      # built first.
      - name: Build the packages the gate drives
        run: npm run build:contracts && npm run build:adapters

      # The gate checks that a runtime's own permission request reaches the
      # owner as the product's approval, that the owner's decision answers the
      # runtime, and that the capability row says what the route really
      # carries. A route that refused the request, or a row that claimed a
      # capability the adapter refuses, fails it.
      #
      # **The gate runs in this pipeline on purpose.** A gate that only runs on
      # the machine that wrote it is not a gate, it is a habit.
      - name: A runtime's permission request reaches the owner
        run: npx tsx scripts/verify-acp-permissions.ts

  codex-app-server:
    name: The Codex App Server route
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The gate drives the adapter itself, so the packages it is built from
      # have to be built. The check is against the repository's own App Server
      # double, so it needs no account and spends no tokens: it runs on every
      # push, on every machine.
      #
      # **The gate runs in this pipeline on purpose.** A gate that only runs on
      # the machine that wrote it is not a gate, it is a habit.
      - name: Build the packages the gate drives
        run: npm run build:deps

      - name: The route carries a thread, a turn, a steer and an approval
        run: npm run verify:codex-app-server

  content-parts:
    name: A message's parts reach the runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The gate drives the built adapters, so the packages it calls have to be
      # built first. It talks to the repository's own double of an agent that
      # speaks the protocol, so it needs no account and spends no tokens.
      - name: Build the packages the gate drives
        run: npm run build:contracts && npm run build:adapters

      # The gate checks that a file the owner attaches reaches the runtime, in
      # each protocol's own shape, and that a route which cannot carry one
      # says so instead of taking the file and dropping it.
      #
      # **The gate runs in this pipeline on purpose.** A gate that only runs on
      # the machine that wrote it is not a gate, it is a habit.
      - name: A file the owner attaches reaches the runtime
        run: npm run verify:content-parts

  standards:
    name: The constitution is honoured
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The install skips the scripts, because the gate loads no native module:
      # it reads the constitution, the roadmap and the glossary, and it imports
      # two source modules rather than their build output.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Every non-negotiable in the constitution names the check that proves it.
      # The gate reads ARCHITECTURE.md and fails when a rule names a check that
      # does not exist, when an enforced rule's check is not reachable from CI,
      # when a rule marked prose only names a check anyway, when a pillar is
      # missing from the roadmap, when the pillar map names a domain the domain
      # map does not publish, or when one of the promoted invariants is broken.
      #
      # **The gate runs in this pipeline on purpose.** A gate that only runs on
      # the machine that wrote it is not a gate, it is a habit — the same
      # lesson the parity gate above already paid for.
      - name: The constitution is honoured
        run: npm run verify:standards
  workflow-lint:
    name: Lint the workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # A workflow that does not parse, or that hands an action an input it
      # does not accept, fails only once somebody pushes — and the CodeQL
      # workflow failed exactly that way until this check existed.
      #
      # The version is pinned rather than tracking `latest`, so the lint
      # cannot change under you and the image can be trusted by digest.
      - name: Check the workflow definitions
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  # ---------------------------------------------------------------------
  # The heavy lane.
  #
  # These jobs run when the workflow is dispatched by hand, and not on every
  # push. They are the whole proof, and they are slow: the test suite, the
  # compiled build, the browser download and the browser tests, and two gates
  # that each rebuild the packages they drive.
  #
  # A branch does not wait for them to be merged, and the work that needs
  # them runs them before it lands.
  # ---------------------------------------------------------------------

  build-and-test:
    name: Build and test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and integration tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: End-to-end smoke test
        run: npx tsx scripts/smoke.ts

      - name: The compiled server boots
        run: npx tsx scripts/verify-build.ts

      # Vite only warns when a chunk is too large, and it still exits zero, so
      # the bundle rules are enforced by a script that fails the build.
      - name: The client bundle stays within its budget
        run: npx tsx scripts/verify-bundle-size.ts

      # The browser download is the slowest step in this job and the one that
      # has cost a run the most. A download that stalled once held the job
      # until its thirty-minute timeout and took the whole run with it: the
      # run was cancelled rather than failed, so the branch was blocked until
      # somebody re-ran it by hand.
      #
      # The browser is a fixed artifact of the Playwright version, so it is
      # cached rather than fetched on every run. The key carries the manifest
      # that pins that version, so a Playwright that moves gets a new cache and
      # a browser that does not move is downloaded once. The step keeps its
      # own short budget, so a download that stalls cannot spend the whole
      # job's thirty minutes: it fails the step instead of the run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/web/package.json') }}

      - name: Install the browser for the end-to-end tests
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: End-to-end browser tests
        run: npm run test:e2e

  session-references:
    name: The session references resolve
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The gate drives the product's own code through a real chat turn, so the
      # packages it calls have to be built first. The worker is the one that
      # runs the turn.
      - name: Build the packages the gate drives
        run: npm run build:deps && npm run build -w @personal-os/worker

      # The gate checks that every published session reference resolves, that
      # every committed revision is one the product wrote, and that a turn ends
      # once. A reference that points at a session the product cannot name, or
      # a revision nobody wrote, fails it.
      #
      # **The gate runs in this pipeline on purpose.** A gate that only runs on
      # the machine that wrote it is not a gate, it is a habit.
      - name: The session references resolve
        run: npx tsx scripts/verify-session-references.ts

  restart-reconciliation:
    name: The worker that dies is reconciled
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The gate drives the worker's own reconciliation, so the packages it
      # calls have to be built first.
      - name: Build the packages the gate drives
        run: npm run build:deps && npm run build -w @personal-os/worker

      # The gate checks that work which had already started is not run again,
      # that the uncertain outcome is visible and the owner can settle it, and
      # that a run whose runtime survived is reconnected rather than started
      # again. A product that replayed the work fails it.
      #
      # **The gate runs in this pipeline on purpose.** A gate that only runs on
      # the machine that wrote it is not a gate, it is a habit.
      - name: The worker that dies is reconciled
        run: npx tsx scripts/verify-restart-reconciliation.ts

  codex-runtime:
    name: The installed Codex answers
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build the packages the gate drives
        run: npm run build:deps

      # The check that drives the installed runtime, through the product's own
      # adapter. **It is skipped — loudly, with the reason printed — where the
      # runtime is not installed, or where it is installed but not signed in**,
      # because a check that needs the owner's credential is not a check that
      # can fail on somebody else's machine. On a machine with Codex on PATH
      # and signed in, it proves the handshake and a turn.
      - name: The installed runtime answers
        run: npm run verify:codex-runtime

  source-stack:
    name: Source hosting and restart
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # The verifier installs its own disposable source checkout.
      - run: npm run verify:source
