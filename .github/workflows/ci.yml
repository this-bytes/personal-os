name: CI

on:
  push:
    # Every branch, not just main.
    #
    # Several agents work in this repository at once, and each of them works
    # on a branch. CI that only ran on main would gate nothing an agent does:
    # the branch is where the work is, so the branch is where the gate has to
    # run. A branch that is green is a branch that can be merged without a
    # second round of waiting.
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch makes the older run irrelevant.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The typecheck and the tests come before the build, deliberately.
      #
      # Both build the packages they need first, so they work on a checkout
      # where nothing has been built. That is the state a contributor is in
      # when they clone the repository and run the documented command, and it
      # is the state the gates broke in once already: the packages resolved
      # through their own dist/, and a fresh clone could not typecheck at all.
      #
      # With the build first, CI would never notice that breaking again — the
      # dist/ directories would already be there and the gates would pass
      # without the thing that makes them pass ever being tested.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Formatting
        run: npm run format:check

      - name: End-to-end smoke test
        run: npx tsx scripts/smoke.ts

      - name: The compiled server boots
        run: npx tsx scripts/verify-build.ts

      # Vite only warns when a chunk is too large, and it still exits zero, so
      # the bundle rules are enforced by a script that fails the build.
      - name: The client bundle stays within its budget
        run: npx tsx scripts/verify-bundle-size.ts

      - name: Install the browser for the end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end browser tests
        run: npm run test:e2e

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The install must not audit. `npm ci` audits by default, so without this
      # flag the job pays for the registry round-trip twice: once inside the
      # install, at npm's own default level, and once in the step below, at the
      # level this job names. The step below is the audit this job is named for.
      #
      # The three jobs that do the same install inside the same budget all carry
      # these two flags. This job was the only one that did not, and it is the
      # one whose job GitHub reported as `cancelled` when it ran out of its ten
      # minutes — which is how a timeout is reported.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # A release that introduces a known vulnerability should not be able to
      # reach main quietly.
      - name: Audit
        run: npm audit --audit-level=high

  contracts:
    name: The published contract matches the tree
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The gate is a TypeScript script, so it needs a runner. The one in the
      # lockfile is the one it should get: an unpinned `npx` download would make
      # a gate depend on the registry at the moment it runs, and fail for the
      # wrong reason.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # A published contract that says the code does not implement something
      # the code has implemented is an invitation to build it a second time.
      # The gate reads the contract's implementation-status notes and checks
      # each one it has a claim for against the tree.
      - name: The published claims match the tree
        run: npm run verify:contracts

  contract-pointers:
    name: "The contract's pointers point at code"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The gate is a TypeScript script, so it needs a runner. The one in the
      # lockfile is the one it should get: an unpinned `npx` download would make
      # a gate depend on the registry at the moment it runs, and fail for the
      # wrong reason.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The contract cites the code by line number, and a citation goes stale
      # every time a nearby line changes. Three items have been spent
      # correcting those citations by hand, which makes it a class of defect
      # rather than three coincidences. The gate reads the contract and checks
      # every citation against the tree: the file is there, the line is in
      # range, and the line holds code.
      - name: "The contract's pointers point at code"
        run: npx tsx scripts/verify-contract-pointers.ts

  docker:
    name: Build and run the stack
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The worker check below runs a TypeScript script, so it needs a
      # runner. The one in the lockfile is the one it should get: an
      # unpinned `npx` download would make a gate depend on the registry
      # at the moment it runs, and fail for the wrong reason.
      - name: Install the runner for the verification
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The stack needs a secret key to encrypt the agents' configuration, and
      # compose refuses to start without one. The key is generated per run and
      # never leaves the job.
      #
      # It goes into the job environment in a step of its own, because a
      # variable written to $GITHUB_ENV is available to the steps that follow
      # it and not to the step that writes it. Written and used in the same
      # step, compose fails with "required variable PERSONAL_OS_SECRET_KEY is
      # missing a value" — and so does the teardown step, which has to parse
      # the same file to take the stack down.
      - name: Create the deployment secret
        run: |
          key="$(openssl rand -base64 32)"
          echo "::add-mask::$key"
          echo "PERSONAL_OS_SECRET_KEY=$key" >> "$GITHUB_ENV"

      # Compose builds the images it runs, from the same context and the same
      # Dockerfile targets, so the stack that is tested is the stack that
      # ships. Building them separately and tagging them differently would
      # prove nothing about the images the containers actually start.
      - name: Build and start the stack
        run: docker compose -f deploy/compose.yaml up -d --build

      - name: Wait for the server to become healthy
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4317/api/health; then
              echo ""
              exit 0
            fi
            sleep 3
          done
          echo "the stack did not become healthy"
          docker compose -f deploy/compose.yaml ps
          docker compose -f deploy/compose.yaml logs --tail 60
          exit 1

      - name: The web client is served
        run: curl -fsS http://127.0.0.1:4317/ | grep -q '<div id="root">'

      # A health check only proves the server answers. The worker is the other
      # half of the product, and it runs as its own container: if it cannot
      # reach the database or is missing a capability it needs, only this
      # check notices.
      - name: The worker in the stack runs the product
        run: npx tsx scripts/verify-stack.ts http://127.0.0.1:4317

      # The check above proves one half of the gate: a deployment that has no
      # owner yet, and the script that creates it. It cannot prove the other
      # half — a deployment that already has an owner, whose password the
      # script does not know. That is the case a developer pointing this gate
      # at their own instance is in, and it is what the static owner token
      # exists for.
      #
      # The order is the point. The token is not set from the start: a job that
      # only ever used the token would prove one path and lose the other. This
      # job proves both, in this order — a fresh deployment works, and a
      # deployment with an existing owner works too.
      - name: The account path cannot get into a deployment that has an owner
        run: |
          # The check above created the owner, so the deployment has one now.
          # Give it a password the script does not know, so the account path
          # provably cannot get in. This must fail with the 401; if it did not
          # fail, the steps after this one would prove nothing.
          other_password="$(openssl rand -base64 24)"
          echo "::add-mask::$other_password"
          docker compose -f deploy/compose.yaml exec -T server \
            node apps/server/dist/index.js --reset-password "$other_password"

          set +e
          output="$(npx tsx scripts/verify-stack.ts http://127.0.0.1:4317 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "the account path signed in to a deployment whose owner it does not know"
            exit 1
          fi
          if ! echo "$output" | grep -q "the owner can sign in (got 401)"; then
            echo "the account path failed, but not with the 401 it has to fail with"
            exit 1
          fi

      # The token goes into the environment file in a step of its own, the way
      # the deployment secret does, because a variable written there is
      # available to the steps that follow it and not to the step that writes
      # it.
      - name: Create the owner token
        run: |
          token="$(openssl rand -hex 24)"
          echo "::add-mask::$token"
          echo "PERSONAL_OS_OWNER_TOKEN=$token" >> "$GITHUB_ENV"

      # The server reads the token from its environment when it starts, so the
      # stack has to be recreated for it to take effect. The data volume is not
      # recreated, so the owner and the password it was given above are still
      # there — which is the point: the token gets in to the deployment the
      # account path could not.
      - name: Restart the stack with the token in it
        run: |
          docker compose -f deploy/compose.yaml up -d
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4317/api/health > /dev/null; then
              exit 0
            fi
            sleep 3
          done
          echo "the stack did not come back with the token in it"
          docker compose -f deploy/compose.yaml ps
          docker compose -f deploy/compose.yaml logs --tail 60
          exit 1

      - name: The token path gets in where the account path could not
        run: npx tsx scripts/verify-stack.ts http://127.0.0.1:4317

      - name: Tear the stack down
        if: always()
        run: docker compose -f deploy/compose.yaml down -v

  workflow-lint:
    name: Lint the workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # A workflow that does not parse, or that hands an action an input it
      # does not accept, fails only once somebody pushes — and the CodeQL
      # workflow failed exactly that way until this check existed.
      #
      # The version is pinned rather than tracking `latest`, so the lint
      # cannot change under you and the image can be trusted by digest.
      - name: Check the workflow definitions
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
