name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch makes the older run irrelevant.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test

      - name: Formatting
        run: npm run format:check

      - name: End-to-end smoke test
        run: npx tsx scripts/smoke.ts

      - name: The compiled server boots
        run: npx tsx scripts/verify-build.ts

      # Vite only warns when a chunk is too large, and it still exits zero, so
      # the bundle rules are enforced by a script that fails the build.
      - name: The client bundle stays within its budget
        run: npx tsx scripts/verify-bundle-size.ts

      - name: Install the browser for the end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end browser tests
        run: npm run test:e2e

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # A release that introduces a known vulnerability should not be able to
      # reach main quietly.
      - name: Audit
        run: npm audit --audit-level=high

  docker:
    name: Build and run the stack
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build the server image
        run: docker build -f deploy/Dockerfile --target server -t personal-os:ci .

      - name: Build the worker image
        run: docker build -f deploy/Dockerfile --target worker -t personal-os:worker-ci .

      - name: Start the stack
        run: |
          echo "PERSONAL_OS_SECRET_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          docker compose -f deploy/compose.yaml up -d

      - name: Wait for the server to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4317/api/health; then
              echo ""
              exit 0
            fi
            sleep 3
          done
          echo "the stack did not become healthy"
          docker compose -f deploy/compose.yaml ps
          docker compose -f deploy/compose.yaml logs --tail 60
          exit 1

      - name: The web client is served
        run: curl -fsS http://127.0.0.1:4317/ | grep -q '<div id="root">'

      - name: Tear the stack down
        if: always()
        run: docker compose -f deploy/compose.yaml down -v
